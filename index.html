<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GIF Party</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700&family=Space+Mono&display=swap');

    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --black: #0a0a0a;
      --white: #f5f5f0;
      --acid: #e8ff3c;
      --dim: #2a2a2a;
      --muted: #666;
    }

    body {
      background: var(--black);
      color: var(--white);
      font-family: 'Space Grotesk', sans-serif;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    #display {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }

    #gif-frame {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: none;
      transition: opacity 0.3s ease;
    }

    #idle-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
      text-align: center;
      padding: 40px;
    }

    #idle-state .label {
      font-family: 'Space Mono', monospace;
      font-size: 13px;
      letter-spacing: 0.15em;
      color: var(--muted);
      text-transform: uppercase;
    }

    #idle-state .url {
      font-size: clamp(28px, 5vw, 56px);
      font-weight: 700;
      color: var(--acid);
      letter-spacing: -0.02em;
    }

    #idle-state .sub {
      font-family: 'Space Mono', monospace;
      font-size: 14px;
      color: var(--muted);
    }

    #pulse {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--acid);
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.3; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.5); }
    }

    #footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 24px;
      border-top: 1px solid var(--dim);
      flex-shrink: 0;
    }

    #footer .brand {
      font-family: 'Space Mono', monospace;
      font-size: 11px;
      color: var(--muted);
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    #footer .submit-prompt {
      font-family: 'Space Mono', monospace;
      font-size: 12px;
      color: var(--white);
    }

    #footer .submit-prompt span {
      color: var(--acid);
      font-weight: 700;
    }

    #footer .live-dot {
      display: flex;
      align-items: center;
      gap: 8px;
      font-family: 'Space Mono', monospace;
      font-size: 11px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.1em;
    }

    #live-indicator {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--acid);
      animation: pulse 1.5s ease-in-out infinite;
    }

    #sender-tag {
      position: absolute;
      bottom: 80px;
      left: 24px;
      font-family: 'Space Mono', monospace;
      font-size: 12px;
      color: rgba(245, 245, 240, 0.5);
      background: rgba(10, 10, 10, 0.6);
      padding: 6px 12px;
      border-radius: 4px;
      display: none;
    }
  </style>
</head>
<body>

  <div id="display">
    <div id="idle-state">
      <div id="pulse"></div>
      <div class="label">Send a GIF to the screen</div>
      <div class="url">paupaupau.vercel.app/submit</div>
      <div class="sub">Open on your phone</div>
    </div>
    <img id="gif-frame" src="" alt="party gif" />
    <div id="sender-tag"></div>
  </div>

  <div id="footer">
    <div class="brand">GIF Party</div>
    <div class="submit-prompt">Go to <span>paupaupau.vercel.app/submit</span> to send a GIF</div>
    <div class="live-dot">
      <div id="live-indicator"></div>
      Live
    </div>
  </div>

  <script>
    const gifFrame = document.getElementById('gif-frame');
    const idleState = document.getElementById('idle-state');
    const senderTag = document.getElementById('sender-tag');

    let lastTimestamp = 0;

    function showGif(url, sender) {
      idleState.style.display = 'none';
      gifFrame.style.display = 'block';
      gifFrame.style.opacity = '0';
      gifFrame.src = url;
      gifFrame.onload = () => {
        gifFrame.style.opacity = '1';
      };
      if (sender) {
        senderTag.textContent = sender;
        senderTag.style.display = 'block';
        setTimeout(() => { senderTag.style.display = 'none'; }, 4000);
      }
    }

    async function poll() {
      try {
        const res = await fetch('/api/current');
        const data = await res.json();
        if (data && data.url && data.timestamp !== lastTimestamp) {
          lastTimestamp = data.timestamp;
          showGif(data.url, data.sender);
        }
      } catch (e) {
        // silent fail — keep polling
      }
      setTimeout(poll, 2000);
    }

    poll();
  </script>
</body>
</html>
